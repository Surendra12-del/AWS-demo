# GitHub Actions CI/CD: build the Spring Boot jar, then deploy it to an EC2 instance over SSH.
#
# HOW IT RUNS: GitHub automatically runs this on every push to the chosen branch.
#
# BEFORE IT WORKS, add these in GitHub -> your repo -> Settings -> Secrets and variables -> Actions -> New repository secret:
#   EC2_SSH_KEY  = the FULL contents of your EC2 .pem private key, INCLUDING the
#                  -----BEGIN ... PRIVATE KEY----- and -----END ... PRIVATE KEY----- lines.
#   EC2_HOST     = your EC2 public IP or DNS, e.g. 13.201.185.81
#   EC2_USER     = ec2-user   (use "ubuntu" if your instance is an Ubuntu image)
#
# ON THE EC2 INSTANCE (one-time), set up the env file + systemd service as in DEPLOY-AWS.md Part E:
#   /home/ec2-user/aws-demo/target/        (folder for the jar)
#   /home/ec2-user/awsdemo.env             (DB_HOST, DB_PASSWORD, AWS_S3_BUCKET, ...)
#   a systemd service named "awsdemo"       (so we can restart it after copying the new jar)

name: Build and Deploy to EC2

on:
  push:
    branches:
      - main            # deploy whenever main is updated.
  workflow_dispatch: {}  # also allows manual "Run workflow" button in the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) get your code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) install Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 3) build the jar (skip tests so a missing DB in CI doesn't block the build)
      - name: Build with Maven
        run: ./mvnw -B clean package -DskipTests

      # 4) copy the freshly built jar to EC2 (this action handles the SSH key robustly)
      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/aws.demo-0.0.1-SNAPSHOT.jar"
          target: "/home/ec2-user/aws-demo/target/"
          strip_components: 1   # drop the "target/" prefix so the file lands directly in the target dir

      # 5) restart the app on EC2 so it picks up the new jar
      - name: Restart app on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart awsdemo
            sleep 3
            systemctl is-active awsdemo
