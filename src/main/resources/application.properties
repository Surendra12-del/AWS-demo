spring.application.name=aws.demo

# ---------------------------------------------------------------------------
# RDS / MySQL datasource
# All values can be overridden with environment variables (see defaults below),
# so on EC2/RDS you only set env vars instead of editing this file.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:awsdemo}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:appuser}
spring.datasource.password=${DB_PASSWORD:apppass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Let Hibernate create/update the schema automatically for easy practice.
# Use 'validate' or 'none' once you manage the schema yourself in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# File upload limits (product images -> S3)
# ---------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---------------------------------------------------------------------------
# AWS configuration (credentials come from the default provider chain:
# env vars / ~/.aws/credentials / EC2 instance IAM role)
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.cloudwatch.namespace=${CW_NAMESPACE:AwsDemo/Application}

# ---------------------------------------------------------------------------
# Actuator: health/info/metrics (used by CloudWatch alarms and EC2/ELB health checks)
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=aws.demo
info.app.description=EC2 + S3 + RDS + CloudWatch practice app
